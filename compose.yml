services:
  postgres:
    image: postgres:16-alpine
    container_name: tokboard_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tokboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokboard}
      POSTGRES_DB: ${POSTGRES_DB:-tokboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tokboard} -d ${POSTGRES_DB:-tokboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: tokboard_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tokboard}:${POSTGRES_PASSWORD:-tokboard}@postgres:5432/${POSTGRES_DB:-tokboard}?schema=public
      PORT: 3000
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-10mb}
      BOARD_IMAGE_MAX_BYTES: ${BOARD_IMAGE_MAX_BYTES:-5242880}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      WS_REQUIRE_AUTH: ${WS_REQUIRE_AUTH:-true}
    volumes:
      - server_uploads:/app/server/uploads

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    container_name: tokboard_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-8080}:80"

volumes:
  postgres_data:
  server_uploads:
